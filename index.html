<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Estufa IoT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde:    #4ade80;
      --verde-dk: #16a34a;
      --amarelo:  #fbbf24;
      --azul:     #60a5fa;
      --alerta:   #f87171;
      --fundo:    #0a0f0d;
      --card:     #111812;
      --card2:    #162019;
      --borda:    #1f2d24;
      --borda2:   #2a3d30;
      --texto:    #e8f0e9;
      --muted:    #6b7f70;
      --nav-h:    68px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--fundo);
      color: var(--texto);
      font-family: 'Bricolage Grotesque', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .app {
      position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto;
      padding: 20px 16px calc(var(--nav-h) + 20px);
    }

    /* ---- Header ---- */
    header {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px; padding-top: 8px;
    }

    .logo {
      font-size: 22px; font-weight: 800;
      color: var(--verde); letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 8px;
    }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--verde); animation: pulse 2s infinite; flex-shrink: 0;
    }
    .logo-sub { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 3px; }

    @keyframes pulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(74,222,128,.4); }
      50%      { opacity:.5; box-shadow: 0 0 0 4px rgba(74,222,128,0); }
    }

    /* ---- Grid sensores ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 16px 14px 14px;
      position: relative; overflow: hidden;
      transition: border-color 0.3s, background 0.3s;
      animation: fadeUp 0.4s ease both;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 56px; height: 56px;
      border-radius: 0 16px 0 56px;
      background: var(--borda); opacity: 0.4;
    }
    .card.alerta { border-color: #7f1d1d; background: #130b0b; }
    .card.alerta::before { background: #7f1d1d; }

    .grid .card:nth-child(1) { animation-delay: .05s; }
    .grid .card:nth-child(2) { animation-delay: .10s; }
    .grid .card:nth-child(3) { animation-delay: .15s; }
    .grid .card:nth-child(4) { animation-delay: .20s; }

    .card-icon  { font-size: 18px; margin-bottom: 10px; opacity: .9; }
    .card-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 4px; }
    .card-valor { font-size: 32px; font-weight: 800; color: var(--verde); line-height: 1; letter-spacing: -1px; transition: color .3s; }
    .card-valor.alerta-val { color: var(--alerta); }
    .card-unidade { font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: 1px; }

    .barra-wrap { margin-top: 10px; height: 3px; background: var(--borda2); border-radius: 2px; overflow: hidden; }
    .barra { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--verde-dk), var(--verde)); transition: width .7s cubic-bezier(.4,0,.2,1), background .3s; }
    .barra.warn { background: linear-gradient(90deg, #991b1b, var(--alerta)); }

    .badge { margin-top: 8px; font-size: 10px; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 99px; display: inline-block; background: rgba(74,222,128,.1); color: var(--verde); border: 1px solid rgba(74,222,128,.2); }
    .badge.warn    { background: rgba(248,113,113,.1); color: var(--alerta); border-color: rgba(248,113,113,.2); }
    .badge.neutral { background: rgba(107,127,112,.1); color: var(--muted);  border-color: rgba(107,127,112,.2); }

    /* ---- Card relatório ---- */
    .card-relatorio {
      background: var(--card); border: 1px solid var(--borda2);
      border-radius: 16px; padding: 16px 18px; margin-top: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; animation: fadeUp 0.4s ease both; animation-delay: .25s;
      transition: background .2s, border-color .2s, transform .1s;
    }
    .card-relatorio:hover  { background: var(--card2); border-color: #3a5040; }
    .card-relatorio:active { transform: scale(0.98); }
    .card-relatorio.carregando { opacity: .6; cursor: not-allowed; }

    .rel-left { display: flex; align-items: center; gap: 12px; }
    .rel-icon { width: 40px; height: 40px; background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .rel-titulo { font-size: 14px; font-weight: 600; color: var(--texto); }
    .rel-desc   { font-size: 11px; color: var(--muted); margin-top: 1px; font-family: 'DM Mono', monospace; }
    .rel-arrow  { color: var(--verde); font-size: 18px; flex-shrink: 0; }

    #status-relatorio { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); margin-top: 6px; text-align: center; min-height: 16px; }

    /* ---- Status bar topo ---- */
    .status-bar {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 20px; padding: 8px 12px;
      background: var(--card); border: 1px solid var(--borda);
      border-radius: 10px;
      animation: fadeUp .4s ease both;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--verde); animation: pulse 2s infinite; flex-shrink: 0; }
    .status-bar-txt { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
    #ultima  { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
    #contador { margin-left: auto; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; }

    /* ---- Tab bar ---- */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(10,15,13,.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--borda2);
      display: flex; align-items: stretch;
      z-index: 100;
      max-width: 480px; margin: 0 auto;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px; text-decoration: none;
      color: var(--muted);
      font-size: 10px; font-family: 'DM Mono', monospace;
      transition: color .2s;
      cursor: pointer; border: none; background: none;
      padding: 0;
    }
    .tab-item:active { opacity: .7; }
    .tab-item.active { color: var(--verde); }

    .tab-icon {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .tab-icon svg { width: 22px; height: 22px; }

    .tab-item.active .tab-icon svg { stroke: var(--verde); }

    /* ---- Animação ---- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app">

  <header>
    <div>
      <div class="logo"><span class="logo-dot"></span>Estufa IoT</div>
      <div class="logo-sub">estufa-01 / ao vivo</div>
    </div>
  </header>

  <div class="status-bar">
    <span class="dot"></span>
    <span class="status-bar-txt">atualiza a cada 5 min</span>
    <span id="ultima">última: --</span>
    <span id="contador">próxima em 5:00</span>
  </div>

  <div class="grid">

      <div class="card-icon">💧</div>
      <div class="card-label">Solo</div>
      <div class="card-valor" id="val-solo">--<span class="card-unidade">%</span></div>
      <div class="barra-wrap"><div class="barra" id="barra-solo" style="width:0%"></div></div>
      <div class="badge neutral" id="st-solo">aguardando</div>
    </div>
    <div class="card" id="card-luz">
      <div class="card-icon">☀️</div>
      <div class="card-label">Luz</div>
      <div class="card-valor" id="val-luz">--</div>
      <div class="barra-wrap"><div class="barra" id="barra-luz" style="width:0%"></div></div>
      <div class="badge neutral" id="st-luz">aguardando</div>
    </div>
    <div class="card" id="card-temp">
      <div class="card-icon">🌡️</div>
      <div class="card-label">Temperatura</div>
      <div class="card-valor" id="val-temp">--<span class="card-unidade">°C</span></div>
      <div class="badge neutral" id="st-temp">aguardando</div>
    </div>
    <div class="card" id="card-ar">
      <div class="card-icon">🌫️</div>
      <div class="card-label">Umidade ar</div>
      <div class="card-valor" id="val-ar">--<span class="card-unidade">%</span></div>
      <div class="barra-wrap"><div class="barra" id="barra-ar" style="width:0%"></div></div>
      <div class="badge neutral" id="st-ar">aguardando</div>
    </div>
  </div>

  <div class="card-relatorio" id="btn-relatorio" onclick="gerarRelatorio()">
    <div class="rel-left">
      <div class="rel-icon">📊</div>
      <div>
        <div class="rel-titulo">Gerar relatório</div>
        <div class="rel-desc">análise via IA · ~30s</div>
      </div>
    </div>
    <div class="rel-arrow">→</div>
  </div>
  <div id="status-relatorio"></div>

<script>
  const INTERVALO = 300;
  let seg = INTERVALO;
  const fmt = n => String(n).padStart(2, '0');

  function setCard(id, alerta) { document.getElementById('card-'+id).classList.toggle('alerta', alerta); }

  function setValor(id, texto, alerta) {
    const el = document.getElementById('val-'+id);
    const span = el.querySelector('span');
    el.classList.toggle('alerta-val', alerta);
    el.textContent = texto;
    if (span) el.appendChild(span);
  }

  function setBarra(id, pct, alerta) {
    const el = document.getElementById('barra-'+id);
    if (!el) return;
    el.style.width = Math.min(pct, 100)+'%';
    el.classList.toggle('warn', alerta);
  }

  function setBadge(id, texto, estado) {
    const el = document.getElementById('st-'+id);
    el.textContent = texto;
    el.className = 'badge'+(estado==='warn'?' warn':estado==='ok'?'':' neutral');
  }

  async function buscar() {
    try {
      const r = await fetch('dados.php');
      const d = await r.json();

      setCard('solo', d.solo_seco);
      setValor('solo', d.umidade_solo, d.solo_seco);
      setBarra('solo', d.umidade_solo, d.solo_seco);
      setBadge('solo', d.solo_seco ? '⚠ solo seco' : '✓ umidade ok', d.solo_seco ? 'warn' : 'ok');

      const pctLuz = Math.round(d.luminosidade / 4095 * 100);
      setCard('luz', d.luz_baixa);
      setValor('luz', d.luminosidade, d.luz_baixa);
      setBarra('luz', pctLuz, d.luz_baixa);
      setBadge('luz', d.luz_baixa ? '⚠ luz baixa' : '✓ ok', d.luz_baixa ? 'warn' : 'ok');

      if (d.temperatura > 0) {
        const quente = d.temperatura > 35;
        setCard('temp', quente);
        setValor('temp', d.temperatura.toFixed(1), quente);
        setBadge('temp', quente ? '⚠ muito quente' : '✓ normal', quente ? 'warn' : 'ok');
      }
      if (d.umidade_ar > 0) {
        const baixa = d.umidade_ar < 30;
        setCard('ar', baixa);
        setValor('ar', d.umidade_ar, baixa);
        setBarra('ar', d.umidade_ar, baixa);
        setBadge('ar', baixa ? '⚠ ar seco' : '✓ ok', baixa ? 'warn' : 'ok');
      }

      document.getElementById('ultima').textContent = 'última: '+new Date().toLocaleTimeString('pt-BR');
      seg = INTERVALO;
    } catch(e) { console.error('Erro:', e); }
  }

  buscar();
  setInterval(buscar, INTERVALO * 1000);
  setInterval(() => {
    const m = Math.floor(seg/60), s = seg%60;
    document.getElementById('contador').textContent = `próxima em ${m}:${fmt(s)}`;
    if (seg > 0) seg--;
  }, 1000);

  async function gerarRelatorio() {
    const btn = document.getElementById('btn-relatorio');
    const st  = document.getElementById('status-relatorio');
    if (btn.classList.contains('carregando')) return;
    btn.classList.add('carregando');
    btn.querySelector('.rel-titulo').textContent = 'Gerando...';
    btn.querySelector('.rel-arrow').textContent = '⏳';
    st.textContent = 'abrindo em nova aba...';
    st.style.color = 'var(--amarelo)';
    try {
      window.open('/estufa/relatorio.php', '_blank');
      st.textContent = '✓ aberto com sucesso';
      st.style.color = 'var(--verde)';
    } catch(e) {
      st.textContent = '✗ erro ao abrir relatório';
      st.style.color = 'var(--alerta)';
    } finally {
      setTimeout(() => {
        btn.classList.remove('carregando');
        btn.querySelector('.rel-titulo').textContent = 'Gerar relatório';
        btn.querySelector('.rel-arrow').textContent = '→';
        setTimeout(() => { st.textContent = ''; }, 4000);
      }, 2000);
    }
  }
</script>
