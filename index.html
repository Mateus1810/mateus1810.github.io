<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Geradores</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 40px;
            color: #333;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 200px;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.3em;
            color: #444;
        }

        .card p {
            color: #666;
            font-size: 0.95em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
    <h1>Painel de Geradores</h1>
    <div class="container">
        <a href="./nota/nota.html">
            <div class="card">
                <h2>Nota de Serviço</h2>
                <p>Crie suas notas de serviço de forma rápida.</p>
            </div>
        </a>

        <a href="./orçamento/orçamento.html">
            <div class="card">
                <h2>Orçamento</h2>
                <p>Monte orçamentos detalhados em segundos.</p>
            </div>
        </a>

        <a href="./chek/check.html">
            <div class="card">
                <h2>Checklist</h2>
                <p>Gere checklists para organizar tarefas e serviços.</p>
            </div>
        </a>
    </div>
</body>
</html>
